{% extends "base.html" %}
{% block title %}Sign in · TPMS{% endblock %}
{% block body %}
<section class="sheet narrow">
  <h1>Sign in</h1>
  <form method="post">
    <label>Your name <input name="name" autocomplete="username" placeholder="so cut orders show who released them"></label>
    <label>Shop password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">Open TPMS</button>
  </form>
</section>
{% endblock %}
